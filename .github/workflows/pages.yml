name: Deploy to GitHub Pages

# Runs when Settings > Pages > Source is "GitHub Actions". With the
# "Deploy from a branch" setting (main / root) the site is served the same way
# and this workflow is simply redundant. Either path serves the repo root,
# where .nojekyll keeps _ds_bundle.js from being dropped by Jekyll.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
