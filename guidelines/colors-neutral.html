<!-- @dsCard group="Colors" viewport="700x160" name="Neutral Colors" subtitle="Ink, paper, sand, stone — the quiet-luxury base" -->
<link rel="stylesheet" href="../styles.css"><body style="margin:0;font-family:var(--font-body);display:flex;height:160px">
<div style="flex:1;background:var(--ink);color:var(--paper);display:flex;flex-direction:column;justify-content:flex-end;padding:12px 14px"><span style="font-size:13px">--ink</span></div>
<div style="flex:1;background:var(--stone);color:var(--paper);display:flex;flex-direction:column;justify-content:flex-end;padding:12px 14px"><span style="font-size:13px">--stone</span></div>
<div style="flex:1;background:var(--stone-light);color:var(--ink);display:flex;flex-direction:column;justify-content:flex-end;padding:12px 14px"><span style="font-size:13px">--stone-light</span></div>
<div style="flex:1;background:var(--line);color:var(--ink);display:flex;flex-direction:column;justify-content:flex-end;padding:12px 14px"><span style="font-size:13px">--line</span></div>
<div style="flex:1;background:var(--sand);color:var(--ink);display:flex;flex-direction:column;justify-content:flex-end;padding:12px 14px"><span style="font-size:13px">--sand</span></div>
<div style="flex:1;background:var(--paper);color:var(--ink);border-left:1px solid var(--line);display:flex;flex-direction:column;justify-content:flex-end;padding:12px 14px"><span style="font-size:13px">--paper</span></div>
</body>
